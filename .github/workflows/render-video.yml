name: Render 3D Animated Video (720p 30FPS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      resolution:
        description: 'Video Resolution'
        required: true
        default: '720p'
      fps:
        description: 'Frames Per Second'
        required: true
        default: '30'

jobs:
  render-video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (FFmpeg & WebGL Mesa Drivers & Chrome)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg xvfb mesa-utils chromium-browser || sudo apt-get install -y ffmpeg xvfb mesa-utils

      - name: Install Project Dependencies
        run: npm install --no-audit --no-fund

      - name: Build & Start Local R3F App
        run: |
          npm run build
          npx vite preview --port 3000 --host 127.0.0.1 &
          npx wait-on http://127.0.0.1:3000

      - name: Render 3D Video Frame-by-Frame (720p @ 30 FPS)
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" node scripts/render.js

      - name: Upload Rendered 3D Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3d-animated-video-720p-30fps
          path: build/rendered_video_720p_30fps.mp4
          retention-days: 14
